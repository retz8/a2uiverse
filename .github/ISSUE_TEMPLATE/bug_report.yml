name: Bug report
description: Something in A2UIVerse doesn't work as the README or SPEC.md says it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The question you asked, the apps running, and what you pressed.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you ran it
      options:
        - The replay (`?beat=`)
        - Apps in deterministic mode
        - Apps in live mode
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The orchestrator's terminal output or the browser console, if either shows an error.
      render: shell
