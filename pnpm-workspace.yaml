packages:
  - "apps/*"
  - "packages/*"
  - "packages/sdk/js"

allowBuilds:
  esbuild: true
  # git-hosted vendor catalogs build on install (their `prepare` runs tsc). pnpm keys the
  # allow entry by the resolved tarball, so this line is re-pointed when the catalog is bumped.
  "github-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/d14fa5b2ffdb1a0e38b21367ed5f5c7d2b0e4e70#path:github/github-catalog": true
  # gmail-catalog, pinned to the tarball pnpm resolved. Re-pointed when the catalog is bumped,
  # exactly as the github-catalog entries above are.
  "gmail-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/9a7e30f86e75194cc3dfd88fd5670002c436baed#path:gmail/gmail-catalog": true
  # calendar-catalog, pinned the same way.
  "calendar-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/9a7e30f86e75194cc3dfd88fd5670002c436baed#path:calendar/calendar-catalog": true
  # The two mock-tier catalogs (task 4.7). Always bundled: the client's catalog table is
  # compile-time until Phase 10 loads catalogs dynamically, when all five git deps leave together.
  "shop-a-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/380526ddfe0b326b57d02f76fa45c7e80dc7bc1d#path:mocks/shop-a/shop-a-catalog": true
  "shop-b-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/380526ddfe0b326b57d02f76fa45c7e80dc7bc1d#path:mocks/shop-b/shop-b-catalog": true
  onnxruntime-node: true
  protobufjs: false
  sharp: false

patchedDependencies:
  "@a2ui/react@0.10.2": patches/@a2ui__react@0.10.2.patch
