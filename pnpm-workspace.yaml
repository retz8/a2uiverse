packages:
  - "apps/*"
  - "packages/*"
  - "packages/sdk/js"

allowBuilds:
  esbuild: true
  # The seven catalogs the registry snapshot packs (task-11.5 decision 10), all pinned to one
  # commit of the apps repo; each builds on install (its `prepare` runs tsc). pnpm keys the allow
  # entry by the resolved tarball, so every line is re-pointed when the pinned commit moves.
  "calendar-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:calendar/calendar-catalog": true
  "circleci-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:circleci/circleci-catalog": true
  "github-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:github/github-catalog": true
  "gmail-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:gmail/gmail-catalog": true
  "linear-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:linear/linear-catalog": true
  "shop-a-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:mocks/shop-a/shop-a-catalog": true
  "shop-b-catalog@https://codeload.github.com/retz8/a2uiverse-apps/tar.gz/7a6d88dbbdc9372c4a8472b53907c278ab805f0c#path:mocks/shop-b/shop-b-catalog": true
  onnxruntime-node: true
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.89"
  - "@ai-sdk/provider-utils@5.0.69"
  - "@ai-sdk/gateway@4.0.127"
  - "@ai-sdk/google@4.0.106"
  - ai@7.0.154

patchedDependencies:
  "@a2ui/react@0.14.0": patches/@a2ui__react@0.14.0.patch
  "@a2ui/web_core@0.14.0": patches/@a2ui__web_core@0.14.0.patch
