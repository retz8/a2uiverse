[project]
name = "a2uiverse-sdk"
version = "0.1.0"
description = "The agent-facing projection of the A2UIVerse app contract: the composition extension a vendor agent reads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
