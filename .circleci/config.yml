# The repository's gates (`pnpm verify`) as two parallel jobs in one workflow, on every branch.

version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

commands:
  install:
    steps:
      - checkout
      - run:
          name: Enable Corepack
          command: sudo corepack enable
      - run:
          name: Point pnpm at a cacheable store
          command: pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

jobs:
  build-typecheck-test:
    executor: node
    steps:
      - install
      - run:
          name: Build, typecheck, test
          command: pnpm exec turbo run build typecheck test

  lint-format:
    executor: node
    steps:
      - install
      - run:
          name: Script tests
          command: pnpm test:scripts
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Format check
          command: pnpm format:check

workflows:
  verify:
    jobs:
      - build-typecheck-test
      - lint-format
